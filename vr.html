<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#95FFD1"></a-box>
      <a-box position="-1 1.2 -3" rotation="0 0 0" color="#FF297A" width="0.4" height="0.4" depth="0.4"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#E3C6FF"></a-sphere>
      <a-cylinder position="1 0.5 -3" radius="0.5" height="1.5" color="#FFFFFF" rotation="90 0 0"></a-cylinder>
      <a-cylinder position="2 2 -4" radius="0.1" height="4" color="#E6D5B8"></a-cylinder>
      <a-sphere position="2 1.5 -4" radius="0.5" color="#C0D033"></a-sphere>
      <a-sphere position="2 2.5 -4" radius="0.5" color="#FFFFFF"></a-sphere>
      <a-sphere position="2 3.5 -4" radius="0.5" color="#FF93AA"></a-sphere>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#004B86"></a-plane>
      <a-sky color="#92E1FF"></a-sky>
    </a-scene>
  </body>
</html>
